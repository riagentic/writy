<!-- Writy app icon (source): a bold W and a text cursor — "write". Flat, readable down to 16 px.
     src/icon.png is rendered from this file: inkscape assets/icon.svg -w 512 -h 512 -o src/icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a7be0"/>
      <stop offset="1" stop-color="#1c3d8c"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <polyline points="122,152 174,362 226,214 278,362 330,152" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="368" y="128" width="28" height="256" rx="14" fill="#7fd3ff"/>
</svg>
