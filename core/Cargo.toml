[package]
name = "xcore"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ironcalc_base = "0.9"
jotdown = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-latex = "0.8"
quick-xml = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tl = "0.7"
wasm-bindgen = "0.2.117"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
